name: Test live DROP/GET
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dropget-e2e.yml
permissions:
  contents: write
jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Test TikTok video audio and photos on deployed service
        run: python dropget/tests/live_e2e.py
      - name: Commit public test report
        if: always()
        run: |
          if [ -f dropget/live-test-report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dropget/live-test-report.json
            git commit -m "Record live DROP/GET smoke test results" || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi

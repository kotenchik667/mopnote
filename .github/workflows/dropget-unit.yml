name: Validate DROP/GET backend
on:
  workflow_dispatch:
  push:
    paths:
      - dropget/server.py
      - dropget/tests/test_server.py
      - .github/workflows/dropget-unit.yml
permissions:
  contents: write
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi "httpx>=0.27" pytest uvicorn pydantic
      - name: Verify compilation and unit tests
        id: verify
        shell: bash
        run: |
          cd dropget
          python -m py_compile server.py
          python -m pytest -q tests/test_server.py 2>&1 | tee unit-test-output.txt
      - name: Store test results
        if: always()
        shell: bash
        run: |
          if [ -f dropget/unit-test-output.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dropget/unit-test-output.txt
            git commit -m "Store DROP/GET unit test results" || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Verify Mopnote
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check engine.js
      - run: node --check app.js
      - run: node --check glitch.js
      - run: node --check sw.js
      - run: node --test tests/*.test.cjs
